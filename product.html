<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foodino | فودینو</title>
    <link rel="shortcut icon" href="./assets/image/fav icon.jfif" type="image/x-icon">
    <link rel="stylesheet" href="./css/product.css">
</head>
<body>
    <section class="card-description"> 
        <div class="icons">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart preview-icon"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left preview-icon"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </div>
        <div class="card">
            <img src="./assets/image/pizza.1.jfif" alt="" class="img-card">
            <div>
                <h4>پیتزا مخصوص</h4>
                <span>پیتزا</span>
                <span class="price">۲۵۰۰۰۰</span>
                <p>پیتزا مخصوص با سس ویژه, پنیر موزارلا, ژامبون,
                    قارچ, فلفل دلمه ای و زیتون.یک انتخاب عالی برای عاشقان پیتزا
                </p>
                <div>
                    <span>تعداد</span>
                    <div>
                        <button class="plus"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus preview-icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
                        <span class="number">1</span>
                        <button class="minus"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus preview-icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
                    </div>
                    <button class="card-btn">افزودن به سبد خرید</button>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="./js/data.js"></script>
    <script type="module" src="./js/product.js"></script>
</body>
</html>
